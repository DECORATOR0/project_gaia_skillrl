<svg width="980" height="620" viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BOOTV7 r1 pseudo-complete graph">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,5 L0,10 Z" fill="#2563eb" />
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .edge { stroke: #9ca3af; stroke-width: 2.1; opacity: 0.74; }
      .initEdge { stroke: #2563eb; stroke-width: 2.7; opacity: 0.95; marker-end: url(#arrow-blue); }
      .node { fill: #ffffff; stroke: #111827; stroke-width: 2.2; }
      .initNode { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.7; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 17px; text-anchor: middle; dominant-baseline: middle; fill: #111827; font-weight: 700; }
      .small { font-size: 13px; font-weight: 400; fill: #4b5563; }
      .caption { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #374151; text-anchor: middle; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #111827; text-anchor: middle; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="980" height="620" />
  <text class="title" x="490" y="32">BOOTV7 r1 graph: INIT + six fully connected non-INIT phases</text>

  <line class="edge" x1="490" y1="180" x2="650" y2="270" />
  <line class="edge" x1="490" y1="180" x2="650" y2="440" />
  <line class="edge" x1="490" y1="180" x2="490" y2="530" />
  <line class="edge" x1="490" y1="180" x2="330" y2="440" />
  <line class="edge" x1="490" y1="180" x2="330" y2="270" />
  <line class="edge" x1="650" y1="270" x2="650" y2="440" />
  <line class="edge" x1="650" y1="270" x2="490" y2="530" />
  <line class="edge" x1="650" y1="270" x2="330" y2="440" />
  <line class="edge" x1="650" y1="270" x2="330" y2="270" />
  <line class="edge" x1="650" y1="440" x2="490" y2="530" />
  <line class="edge" x1="650" y1="440" x2="330" y2="440" />
  <line class="edge" x1="650" y1="440" x2="330" y2="270" />
  <line class="edge" x1="490" y1="530" x2="330" y2="440" />
  <line class="edge" x1="490" y1="530" x2="330" y2="270" />
  <line class="edge" x1="330" y1="440" x2="330" y2="270" />

  <line class="initEdge" x1="490" y1="120" x2="490" y2="140" />
  <line class="initEdge" x1="490" y1="120" x2="620" y2="240" />
  <line class="initEdge" x1="490" y1="120" x2="628" y2="402" />
  <line class="initEdge" x1="490" y1="120" x2="490" y2="486" />
  <line class="initEdge" x1="490" y1="120" x2="352" y2="402" />
  <line class="initEdge" x1="490" y1="120" x2="360" y2="240" />

  <circle class="initNode" cx="490" cy="82" r="42" />
  <text class="label" x="490" y="82">INIT</text>

  <circle class="node" cx="490" cy="180" r="45" />
  <text class="label" x="490" y="171">LOCAL</text>
  <text class="label small" x="490" y="196">EVIDENCE</text>

  <circle class="node" cx="650" cy="270" r="45" />
  <text class="label" x="650" y="261">WEB</text>
  <text class="label small" x="650" y="286">RETRIEVE</text>

  <circle class="node" cx="650" cy="440" r="45" />
  <text class="label" x="650" y="424">MULTI</text>
  <text class="label small" x="650" y="445">MODAL</text>
  <text class="label small" x="650" y="464">EXTRACT</text>

  <circle class="node" cx="490" cy="530" r="45" />
  <text class="label" x="490" y="530">COMPUTE</text>

  <circle class="node" cx="330" cy="440" r="45" />
  <text class="label" x="330" y="440">VERIFY</text>

  <circle class="node" cx="330" cy="270" r="45" />
  <text class="label" x="330" y="270">REPAIR</text>

  <text class="caption" x="490" y="596">Gray: complete bidirectional connectivity among six non-INIT phases. Blue: INIT enters each phase.</text>
</svg>
