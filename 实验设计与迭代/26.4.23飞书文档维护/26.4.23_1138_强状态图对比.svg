      .small { font: 13px sans-serif; fill: #333; }
      .title { font: 22px sans-serif; font-weight: 700; fill: #333; }
      .edge { fill: none; stroke: #333; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-soft { fill: none; stroke: #555; stroke-width: 1.8; marker-end: url(#arrow); }
