[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-skillrl"
version = "0.1.0"
description = "Single-executor skill training scaffold for GAIA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "datasets>=4.2.0",
  "duckduckgo-search>=8.1.1",
  "httpx>=0.28.1",
  "huggingface_hub>=0.34.4",
  "lxml>=5.3.0",
  "openai>=2.30.0",
  "openpyxl>=3.1.5",
  "pandas>=2.2.3",
  "Pillow>=10.4.0",
  "pypdf>=5.9.0",
  "PyYAML>=6.0.2",
  "tqdm>=4.66.5",
]

[project.scripts]
gaia-skillrl = "gaia_skillrl.cli:main"

[tool.setuptools.packages.find]
include = ["gaia_skillrl*"]
